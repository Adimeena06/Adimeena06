<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace"><title>AI Therapist – Facial emotion recognition prototype using FER2013, Python, OpenCV, DeepFace and TensorFlow/Keras, with a FastAPI and React-based session reporting implementation.</title><defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2E93"/></linearGradient>
