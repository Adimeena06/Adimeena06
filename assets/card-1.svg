<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" role="img" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace"><title>CleanSweep AI – AI-powered smart waste management platform featuring waste detection and classification, a FastAPI backend, a React frontend and intelligent municipal dispatch.</title><defs><linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00F0FF"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#FF2E93"/></linearGradient>
